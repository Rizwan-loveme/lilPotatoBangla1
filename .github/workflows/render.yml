name: Render captioned video

on:
  workflow_dispatch:
    inputs:
      separate_audio:
        description: "Separate voice / effects with Demucs before rendering"
        type: boolean
        default: true
      publish_release:
        description: "Also attach the MP4 to a GitHub Release"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/render.yml"

permissions:
  contents: write # needed only for publish_release

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System dependencies (ffmpeg + Chrome libs for Remotion)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev \
            libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install npm packages
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Demucs (CPU)
        if: ${{ github.event_name == 'push' || inputs.separate_audio }}
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" demucs==4.0.1 soundfile

      - name: Separate audio (voice / effects)
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.separate_audio }}" = "true" ]; then
            bash scripts/separate-audio.sh src/lilpotato1.mp4
          else
            echo '{"mode":"original"}' > src/audioMode.json
            ffmpeg -y -i src/lilpotato1.mp4 -vn -ac 2 -ar 44100 -c:a pcm_s16le public/audio/original.wav
          fi
          cat src/audioMode.json
          ls -la public/audio

      - name: Export SRT files
        run: npm run srt

      - name: Render video (Remotion)
        run: npx remotion render LilPotatoCaptions out/lilpotato1-captioned.mp4 --codec=h264 --crf=18 --concurrency=2

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: lilpotato1-captioned
          path: |
            out/lilpotato1-captioned.mp4
            out/captions.en.srt
            out/captions.bn.srt
            public/audio/voice.wav
            public/audio/effects.wav
          if-no-files-found: warn
          retention-days: 30

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "render-${{ github.run_number }}" \
            out/lilpotato1-captioned.mp4 out/captions.en.srt out/captions.bn.srt \
            --title "Captioned render #${{ github.run_number }}" \
            --notes "Rendered from commit ${{ github.sha }}"
